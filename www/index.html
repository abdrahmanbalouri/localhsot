<!DOCTYPE html>
<html>
<head>
    <title>Java Custom Server</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #1a73e8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to Your Java Server!</h1>
        <p>This page is served statically by your custom HTTP/1.1 server.</p>
        <p>Check out the <a href="/cgi-bin/hello.py">CGI Demo</a>.</p>
    </div>
</body>
</html>
